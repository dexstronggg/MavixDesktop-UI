name: Build Windows EXE

# Запускается ТОЛЬКО вручную (кнопка «Run workflow» во вкладке Actions)
# или по тегу версии vX.Y. На обычные push НЕ срабатывает — ждать сборку
# на каждый коммит не нужно.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Ветка для сборки .exe'
        default: 'main'
        required: true
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # при ручном запуске — выбранная ветка; по тегу — сам тег
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller
          # opencv нужен только если ветка тянет collect_all('cv2') (delivery);
          # на remote он в excludes и просто не используется — ставим для надёжности.
          pip install opencv-python-headless

      - name: Build (.exe)
        run: python -m PyInstaller mavixdesktop.spec --clean --noconfirm

      - name: Show result
        run: |
          Get-ChildItem dist
          if (-not (Test-Path dist/mavixdesktop.exe)) { throw 'mavixdesktop.exe не собрался' }

      - name: Verify SDL2 DLLs in bundle
        run: |
          # --onefile: на диске лежит только .exe, DLL упакованы внутрь него,
          # поэтому проверяем оглавление архива, а не файлы в dist.
          $toc = python -m PyInstaller.utils.cliutils.archive_viewer --list dist/mavixdesktop.exe
          $sdl2 = $toc | Select-String -Pattern 'SDL2'
          if (-not $sdl2) { throw 'SDL2 не найден в бандле — pygame не попал в сборку' }
          Write-Host "SDL2 в бандле: $($sdl2.Count) записей"

      - name: Smoke-run (.exe)
        run: |
          $p = Start-Process -FilePath "dist\mavixdesktop.exe" -PassThru
          try {
            Start-Sleep -Seconds 10
            if ($p.HasExited) {
              Write-Error "mavixdesktop.exe exited early with code $($p.ExitCode)"
              exit 1
            }
            Write-Host 'mavixdesktop.exe жив после 10 секунд'
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mavixdesktop-exe
          path: dist/mavixdesktop.exe
          if-no-files-found: error
          retention-days: 30
